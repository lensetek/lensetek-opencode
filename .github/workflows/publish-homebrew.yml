name: publish-homebrew

on:
  release:
    types: [released]
  workflow_dispatch:

concurrency:
  group: publish-homebrew
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  homebrew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "^1.3.14"

      - name: Check tap token
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "${GH_PAT:-}" ]; then echo "HAS_HOMEBREW_PAT=1" >> "$GITHUB_ENV"; fi

      - name: Resolve version
        if: env.HAS_HOMEBREW_PAT == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          echo "OPENCODE_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Update homebrew tap
        if: env.HAS_HOMEBREW_PAT == '1'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
          OPENCODE_VERSION: ${{ env.OPENCODE_VERSION }}
        run: bun ./packages/opencode/script/update-tap.ts