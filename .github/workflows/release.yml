name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "^1.3.14"

      - name: Build and package release binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          export OPENCODE_RELEASE="true"
          export OPENCODE_CHANNEL="latest"
          if [[ "${{ github.ref_name }}" =~ ^v ]]; then
            export OPENCODE_VERSION="${GITHUB_REF_NAME#v}"
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
          ./packages/opencode/script/build.ts --skip-embed-web-ui

      - name: Upload build artifacts (manual test only)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: lensetek-binaries
          path: packages/opencode/dist/*.zip
          if-no-files-found: error