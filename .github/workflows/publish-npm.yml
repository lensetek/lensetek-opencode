name: publish-npm

on:
  release:
    types: [released]
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "^1.3.14"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Check npm token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then echo "HAS_NPM_TOKEN=1" >> "$GITHUB_ENV"; fi

      - name: Resolve version
        if: env.HAS_NPM_TOKEN == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          echo "OPENCODE_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Build release binaries
        if: env.HAS_NPM_TOKEN == '1'
        env:
          GH_REPO: ${{ github.repository }}
          OPENCODE_RELEASE: "false"
          OPENCODE_CHANNEL: "latest"
          OPENCODE_VERSION: ${{ env.OPENCODE_VERSION }}
        run: ./packages/opencode/script/build.ts --skip-embed-web-ui

      - name: Publish to npm
        if: env.HAS_NPM_TOKEN == '1'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          OPENCODE_CHANNEL: "latest"
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          bun ./packages/opencode/script/publish-lensetek.ts